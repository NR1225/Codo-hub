<!doctype html><html lang="kk"><head><meta charset="utf-8"><title>Қасқыр стикерлері</title>
<style>body{margin:0;padding:32px;background:#111;color:#eee;font-family:system-ui,sans-serif}
h1{font-size:20px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
figure{margin:0;padding:12px;border-radius:16px;background:#1c1c1c;text-align:center}
img{width:128px;height:128px}figcaption{margin-top:6px;font-size:14px;opacity:.8}
.light{background:#f4f4f5;color:#111}.light figure{background:#fff}</style></head>
<body><h1>Codo Hub қасқыр стикерлері (16)</h1>
<button onclick="document.body.classList.toggle('light')">Ашық / қараңғы фон</button><br><br>
<main><figure><img src="smile.svg" alt="Сәлем"><figcaption>Сәлем</figcaption></figure><figure><img src="happy.svg" alt="Қуанышты"><figcaption>Қуанышты</figcaption></figure><figure><img src="love.svg" alt="Ғашық"><figcaption>Ғашық</figcaption></figure><figure><img src="laugh.svg" alt="Күлкі"><figcaption>Күлкі</figcaption></figure><figure><img src="wink.svg" alt="Көз қысу"><figcaption>Көз қысу</figcaption></figure><figure><img src="wow.svg" alt="Таң қалу"><figcaption>Таң қалу</figcaption></figure><figure><img src="sad.svg" alt="Мұңды"><figcaption>Мұңды</figcaption></figure><figure><img src="angry.svg" alt="Ашулы"><figcaption>Ашулы</figcaption></figure><figure><img src="cool.svg" alt="Керемет"><figcaption>Керемет</figcaption></figure><figure><img src="fire.svg" alt="Отты"><figcaption>Отты</figcaption></figure><figure><img src="think.svg" alt="Ойлану"><figcaption>Ойлану</figcaption></figure><figure><img src="sleepy.svg" alt="Ұйқылы"><figcaption>Ұйқылы</figcaption></figure><figure><img src="code.svg" alt="Код"><figcaption>Код</figcaption></figure><figure><img src="100.svg" alt="100"><figcaption>100</figcaption></figure><figure><img src="sweat.svg" alt="Ыңғайсыз"><figcaption>Ыңғайсыз</figcaption></figure><figure><img src="thanks.svg" alt="Рақмет"><figcaption>Рақмет</figcaption></figure></main></body></html>
